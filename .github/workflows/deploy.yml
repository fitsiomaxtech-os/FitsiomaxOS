name: Deploy to VPS

on:
  push:
    branches:
      - main
    # A push that only touches markdown cannot break the build, and proving that
    # costs a full verify run. Skipping the workflow outright -- deploy included
    # -- leaves the VPS one commit behind on a README until the next real push.
    # Nothing served at runtime reads these files, so that lag costs nothing.
    # Drop this filter if a .md ever becomes a runtime input.
    # A side effect: an empty commit (git commit --allow-empty) changes no files,
    # so it matches nothing outside the filter and starts no run either. To force
    # a redeploy, push a commit that touches a non-markdown file.
    paths-ignore:
      - '**.md'

jobs:
  # One job, on the VPS runner. There used to be a separate `verify` job on a
  # GitHub-hosted runner that built the frontend before this one was allowed to
  # touch the box. It worked, but it cost ~45s of the ~65s a push took: a cold
  # runner had to boot, check out, install Node, pull a 49 MB node_modules cache
  # and run a full CRA production build -- whose output was then thrown away,
  # since the deploy script below never reads it.
  #
  # That frontend build was removed by request on 2026-09-02 to put pushes back
  # near 20s. What it buys in speed it gives up in safety, and the trade is
  # worth stating plainly: a JavaScript import of a module nobody committed now
  # reaches the VPS, and nothing catches it until the app fails in a browser.
  # Re-adding it means restoring the verify job from a100efb/b2bfd36.
  #
  # The backend check below is NOT part of that trade and should stay. It costs
  # about a second, and it is the only automated thing standing between a bad
  # commit and server.py's startup hook, which fires ~40 migrations against the
  # live database on every restart -- several of them writing to lead rows
  # (seed.py's undo_branch_leads_stage rewrites branch_stage and deletes a
  # pipeline stage; normalize_lead_session_package_prices rewrites
  # session_package_price). A half-saved router is a state this repo reaches
  # whenever more than one session is writing to it, and restarting into one is
  # how those migrations run against data they were never meant to touch.
  #
  # It proves the backend parses. It does not check imports or anything at
  # runtime.
  deploy:
    runs-on: [self-hosted, osfitsiomax-vps]
    steps:
      # Here only so the step below has a tree to compile. Incremental on a
      # self-hosted runner, whose workspace persists between runs. This is not
      # the checkout the deploy uses -- the script does its own pull into
      # /root/OSFITSIOMAX -- but it is the same commit, so the check holds.
      - uses: actions/checkout@v4

      - name: Compile backend
        run: python3 -m compileall -q backend

      # MongoDB was installed with its unit disabled, so it does not come back when
      # the VPS reboots. On 2026-10-17 the box rebooted, mongod stayed down, and the
      # backend sat in startup waiting on 127.0.0.1:27017 -- every /api call a 502,
      # nobody able to sign in. Enabling it here starts it now and on every boot.
      - name: Make sure MongoDB is running
        run: |
          systemctl enable --now mongod
          for i in $(seq 1 30); do
            systemctl is-active --quiet mongod && (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null && { echo "mongod is up"; exit 0; }
            sleep 2
          done
          systemctl status mongod --no-pager -l | head -20
          journalctl -u mongod --no-pager -n 60
          exit 1

      - name: Deploy to VPS
        run: bash /root/deploy-osfitsiomax.sh

      # The script above restarts the services and reports "Deploy complete" whether
      # or not the backend came back. On 2026-10-18 it did not: the page loaded and
      # every /api call was a 502, so nobody could sign in, and the run was green.
      # This waits for the API to answer, and if it never does, prints what the box
      # knows about why and fails the run.
      - name: Check the backend is answering
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 -X POST https://os.fitsiomax.clinic/api/v3/auth/login -H "Content-Type: application/json" -d '{"email":"deploy-check@invalid","password":"x"}' || true)
            echo "attempt $i: /api/v3/auth/login -> $code"
            case "$code" in 2*|4*) exit 0;; esac
            sleep 5
          done
          echo "::error::Backend is not answering after the deploy"
          set +e
          echo "== nginx upstream =="; grep -rhn "proxy_pass" /etc/nginx/sites-enabled/ 2>/dev/null
          echo "== listening ports =="; ss -ltnp 2>/dev/null | grep -Ei "uvicorn|python|mongo|:80|:443|:8001|:8000"
          echo "== services =="; systemctl list-units --all --type=service --no-pager 2>/dev/null | grep -Ei "osfit|fitsio|backend|uvicorn|mongo|nginx"
          for u in $(systemctl list-units --all --type=service --no-pager --plain 2>/dev/null | awk '{print $1}' | grep -Ei "osfit|fitsio|backend|uvicorn|mongo"); do
            echo "== status $u =="; systemctl status "$u" --no-pager -l 2>/dev/null | head -20
            echo "== journal $u =="; journalctl -u "$u" --no-pager -n 80 2>/dev/null | tail -80
          done
          command -v pm2 >/dev/null && { echo "== pm2 =="; pm2 ls; pm2 logs --nostream --lines 60 2>/dev/null | tail -80; }
          command -v supervisorctl >/dev/null && { echo "== supervisor =="; supervisorctl status; for f in /var/log/supervisor/*backend*err*.log; do echo "-- $f"; tail -60 "$f"; done; }
          echo "== disk =="; df -h / /var 2>/dev/null
          echo "== memory =="; free -m
          echo "== oom =="; dmesg 2>/dev/null | grep -i -E "killed process|out of memory" | tail -5
          exit 1
